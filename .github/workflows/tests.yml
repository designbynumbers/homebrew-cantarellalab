name: tests

# Build-from-source install test for the cantarellalab tap formulae.
#
# Why not the stock `brew test-bot` template? test-bot only tests formulae that
# changed in the diff and is bottle-oriented. knoodle disables bottles
# (-march=native) and we bump the formula directly on main, so an explicit
# tap -> audit -> install --build-from-source -> test is clearer and actually
# runs on every formula change. Uses Homebrew's official setup-homebrew action,
# so it's free on GitHub-hosted runners as long as this repo stays public.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 1st of each month, 07:00 UTC: catch breakage from upstream Homebrew
    # dependency bumps (boost / suite-sparse / clp / metis) before a user hits it.
    - cron: "0 7 1 * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  knoodle:
    name: knoodle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is PINNED on purpose: macos-latest can resolve to macos-15,
        # whose libc++ lacks floating-point std::from_chars and fails the build.
        # ubuntu-latest is deliberately UNPINNED: Ubuntu has no equivalent
        # correctness cliff (a newer image means newer glibc/gcc, still Homebrew
        # Tier 1), so we track -latest to catch breakage from a future Ubuntu
        # image (e.g. 26.04) early -- ideally before users upgrade. It is a
        # required leg, so a break fails the run and emails the maintainer; the
        # monthly cron below guarantees detection within ~30 days without pushes.
        #   ubuntu-latest => Linuxbrew (also the WSL2/Ubuntu proxy)
        #   macos-26      => supported macOS toolchain (recent Apple Clang/libc++)
        os: [ubuntu-latest, macos-26]
        include:
          # Informational: macOS 15 / Clang 17 lacks floating-point
          # std::from_chars, so the build is expected to fail there. This leg
          # documents the unsupported boundary and acts as a tripwire if the
          # upstream code ever gains a fallback; it does not fail the workflow.
          - os: macos-15
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      # No source cache needed: knoodle now fetches a small (~11 MB) vendored
      # release tarball, not a Git-LFS clone -- so there's no LFS bandwidth to spare.

      # No manual tap step: setup-homebrew already symlinks this checkout in as
      # the designbynumbers/cantarellalab tap, so the formula under test is this
      # commit's (PR-aware), and we avoid clobbering that symlink.

      - name: Audit formula
        run: brew audit --strict designbynumbers/cantarellalab/knoodle

      - name: Install knoodle (build from source)
        run: brew install --build-from-source --verbose designbynumbers/cantarellalab/knoodle

      - name: Run the formula test block
        run: brew test --verbose designbynumbers/cantarellalab/knoodle

  # RHEL-family coverage. No native Fedora/RHEL GitHub runner exists, so these run
  # as containers on ubuntu-latest:
  #   fedora:latest => Tier 1 (recent glibc, uses system glibc like Ubuntu)
  #   rockylinux:9  => Tier 2 (glibc 2.34 -> Homebrew bootstraps its own glibc 2.39
  #                    + gcc); proxy for the UGA Sapelo2 cluster (Rocky 9.5).
  # Required leg (validated locally + on x86 CI): a break fails the run and emails
  # the maintainer -- early warning before a Fedora user or the Sapelo2 cluster
  # hits it. Skipped on pull_request to keep PR CI fast (these container legs do a
  # full Homebrew bootstrap + source build); we bump on main, so push/cron/dispatch
  # coverage is enough.
  knoodle-rpm:
    name: knoodle (${{ matrix.container }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["fedora:latest", "rockylinux:9"]
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install prerequisites (dnf)
        # Tools the Ubuntu runner ships preinstalled but a bare RPM image lacks.
        # curl is deliberately NOT installed: the base images ship curl-minimal
        # (provides curl); installing full curl conflicts with it, and the
        # --allowerasing workaround is rejected by Fedora's dnf5. `which` is
        # best-effort: newest Fedora drops the package (brew uses command -v),
        # while Rocky 9 still provides it. (No git-lfs: the source is a tarball.)
        run: |
          dnf -y install \
            gcc gcc-c++ make git procps-ng file tar gzip \
            findutils sudo util-linux diffutils
          dnf -y install which || true

      - name: Create non-root Homebrew user
        # Homebrew refuses to run as root; its installer also calls sudo (chown),
        # so linuxbrew needs passwordless sudo.
        run: |
          useradd -m -s /bin/bash linuxbrew
          echo 'linuxbrew ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/linuxbrew

      - name: Check out tap
        uses: actions/checkout@v4

      - name: Install + test knoodle as the linuxbrew user
        run: |
          # Give linuxbrew an owned copy of the checked-out tap to symlink in.
          cp -a "$GITHUB_WORKSPACE" /home/linuxbrew/cantarellalab
          chown -R linuxbrew:linuxbrew /home/linuxbrew/cantarellalab
          runuser -u linuxbrew -- bash -eux <<'EOSU'
          export NONINTERACTIVE=1
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          uname -m; brew --version | head -1
          # Wire the checked-out tap (this commit, with any uncommitted edits).
          TAPDIR="$(brew --repository)/Library/Taps/designbynumbers/homebrew-cantarellalab"
          mkdir -p "$(dirname "$TAPDIR")"
          ln -s /home/linuxbrew/cantarellalab "$TAPDIR"
          # A manually-bootstrapped brew enforces HOMEBREW_REQUIRE_TAP_TRUST, so trust our
          # symlinked tap -- otherwise loading cross-tap deps (ridgerunner -> libplcurve/
          # libtsnnls) is refused. (setup-homebrew does this automatically on native legs.)
          brew trust designbynumbers/cantarellalab
          brew audit --strict designbynumbers/cantarellalab/knoodle
          brew install --build-from-source --verbose designbynumbers/cantarellalab/knoodle
          brew test --verbose designbynumbers/cantarellalab/knoodle
          EOSU

  # ridgerunner builds the tap's dependency chain: openblas/gsl/argtable come from
  # Homebrew core (bottled), while libplcurve and libtsnnls are tap formulae with no
  # bottles, so `brew install --build-from-source ridgerunner` compiles the whole
  # chain (libplcurve -> libtsnnls -> ridgerunner) automatically. We audit only
  # ridgerunner here -- libplcurve/libtsnnls get their own dedicated audit jobs below
  # -- but still `brew test` all three, since the install builds them and the tests
  # are cheap end-to-end coverage of the assembled chain.
  ridgerunner:
    name: ridgerunner (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Both GitHub macOS runners are Apple Silicon now (Intel macos-13 is retired),
        # so this is arm64 macOS + Linuxbrew. ridgerunner is plain C/autotools with no
        # libc++ from_chars cliff, so we don't need knoodle's macos-15 tripwire leg.
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Audit formula
        run: brew audit --strict designbynumbers/cantarellalab/ridgerunner

      - name: Install ridgerunner (build the whole chain from source)
        run: brew install --build-from-source --verbose designbynumbers/cantarellalab/ridgerunner

      - name: Run the formula test blocks (chain)
        run: |
          brew test --verbose designbynumbers/cantarellalab/libplcurve
          brew test --verbose designbynumbers/cantarellalab/libtsnnls
          brew test --verbose designbynumbers/cantarellalab/ridgerunner

  # RHEL-family coverage for the ridgerunner chain, same container strategy as
  # knoodle-rpm (no native Fedora/RHEL runner exists). Skipped on pull_request to
  # keep PR CI fast; push/cron/dispatch coverage is enough since we bump on main.
  ridgerunner-rpm:
    name: ridgerunner (${{ matrix.container }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["fedora:latest", "rockylinux:9"]
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install prerequisites (dnf)
        # Same bare-image gap-fillers as knoodle-rpm; ridgerunner is a C/autotools
        # build, so gcc + make + the coreutils below are all it needs on top of what
        # Homebrew bootstraps. See the knoodle-rpm notes for the curl/which caveats.
        run: |
          dnf -y install \
            gcc gcc-c++ make git procps-ng file tar gzip \
            findutils sudo util-linux diffutils
          dnf -y install which || true

      - name: Create non-root Homebrew user
        run: |
          useradd -m -s /bin/bash linuxbrew
          echo 'linuxbrew ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/linuxbrew

      - name: Check out tap
        uses: actions/checkout@v4

      - name: Install + test the ridgerunner chain as the linuxbrew user
        run: |
          cp -a "$GITHUB_WORKSPACE" /home/linuxbrew/cantarellalab
          chown -R linuxbrew:linuxbrew /home/linuxbrew/cantarellalab
          runuser -u linuxbrew -- bash -eux <<'EOSU'
          export NONINTERACTIVE=1
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          uname -m; brew --version | head -1
          TAPDIR="$(brew --repository)/Library/Taps/designbynumbers/homebrew-cantarellalab"
          mkdir -p "$(dirname "$TAPDIR")"
          ln -s /home/linuxbrew/cantarellalab "$TAPDIR"
          # A manually-bootstrapped brew enforces HOMEBREW_REQUIRE_TAP_TRUST, so trust our
          # symlinked tap -- otherwise loading cross-tap deps (ridgerunner -> libplcurve/
          # libtsnnls) is refused. (setup-homebrew does this automatically on native legs.)
          brew trust designbynumbers/cantarellalab
          brew audit --strict designbynumbers/cantarellalab/ridgerunner
          brew install --build-from-source --verbose designbynumbers/cantarellalab/ridgerunner
          brew test --verbose designbynumbers/cantarellalab/libplcurve
          brew test --verbose designbynumbers/cantarellalab/libtsnnls
          brew test --verbose designbynumbers/cantarellalab/ridgerunner
          EOSU

  # Dedicated per-library jobs for libplcurve + libtsnnls. The ridgerunner chain job
  # above already builds them as dependencies, but these give each library isolated
  # audit/build/test signal that stands on its own (and stays green independently of
  # ridgerunner). Unlike knoodle/ridgerunner -- which install from self-contained
  # tarballs that ship a prebuilt ./configure -- plcurve/tsnnls ship pure source
  # tarballs, so their formulae run ./autogen.sh (autoconf/automake/libtool, pulled in
  # by Homebrew; autoconf brings its own Perl on Linux via uses_from_macos, so the RPM
  # images need no extra dnf packages beyond the shared set below).
  libplcurve:
    name: libplcurve (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tap
        uses: actions/checkout@v4
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-
      - name: Audit formula
        run: brew audit --strict designbynumbers/cantarellalab/libplcurve
      - name: Install libplcurve (build from source)
        run: brew install --build-from-source --verbose designbynumbers/cantarellalab/libplcurve
      - name: Run the formula test block
        run: brew test --verbose designbynumbers/cantarellalab/libplcurve
      - name: C++ header smoke test (issue #2)
        # plCurve.h is a public installed header, so it must be includable from C++.
        # It currently uses the C99 `restrict` keyword (invalid in C++), so this FAILS
        # until upstream makes the header C++-safe -- see the handoff
        # ~/plcurve/handoff/plcurve-header-cxx-restrict. Build compiles plCurve's own C
        # sources (restrict is fine in C), so only this consumer-style check catches it.
        run: |
          printf '#include <plCurve.h>\nint main(void){return 0;}\n' > cxx_smoke.cc
          c++ -I"$(brew --prefix)/include" -fsyntax-only cxx_smoke.cc

  libplcurve-rpm:
    name: libplcurve (${{ matrix.container }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["fedora:latest", "rockylinux:9"]
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install prerequisites (dnf)
        run: |
          dnf -y install \
            gcc gcc-c++ make git procps-ng file tar gzip \
            findutils sudo util-linux diffutils
          dnf -y install which || true
      - name: Create non-root Homebrew user
        run: |
          useradd -m -s /bin/bash linuxbrew
          echo 'linuxbrew ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/linuxbrew
      - name: Check out tap
        uses: actions/checkout@v4
      - name: Install + test libplcurve as the linuxbrew user
        run: |
          cp -a "$GITHUB_WORKSPACE" /home/linuxbrew/cantarellalab
          chown -R linuxbrew:linuxbrew /home/linuxbrew/cantarellalab
          runuser -u linuxbrew -- bash -eux <<'EOSU'
          export NONINTERACTIVE=1
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          uname -m; brew --version | head -1
          TAPDIR="$(brew --repository)/Library/Taps/designbynumbers/homebrew-cantarellalab"
          mkdir -p "$(dirname "$TAPDIR")"
          ln -s /home/linuxbrew/cantarellalab "$TAPDIR"
          # A manually-bootstrapped brew enforces HOMEBREW_REQUIRE_TAP_TRUST, so trust our
          # symlinked tap -- otherwise loading cross-tap deps (ridgerunner -> libplcurve/
          # libtsnnls) is refused. (setup-homebrew does this automatically on native legs.)
          brew trust designbynumbers/cantarellalab
          brew audit --strict designbynumbers/cantarellalab/libplcurve
          brew install --build-from-source --verbose designbynumbers/cantarellalab/libplcurve
          brew test --verbose designbynumbers/cantarellalab/libplcurve
          # C++ header smoke test (issue #2): plCurve.h must be includable from C++.
          # Fails until upstream drops/guards the C99 `restrict` keyword in the header.
          printf '#include <plCurve.h>\nint main(void){return 0;}\n' > /tmp/cxx_smoke.cc
          c++ -I"$(brew --prefix)/include" -fsyntax-only /tmp/cxx_smoke.cc
          EOSU

  libtsnnls:
    name: libtsnnls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tap
        uses: actions/checkout@v4
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-
      - name: Audit formula
        run: brew audit --strict designbynumbers/cantarellalab/libtsnnls
      - name: Install libtsnnls (build from source)
        run: brew install --build-from-source --verbose designbynumbers/cantarellalab/libtsnnls
      - name: Run the formula test block
        run: brew test --verbose designbynumbers/cantarellalab/libtsnnls
      - name: C++ header smoke test (self-containment)
        # tsnnls.h uses FILE* (lines 71-72) without including <stdio.h>, so including it
        # first fails to compile in C and C++ alike. FAILS until upstream adds the missing
        # include -- see the handoff ~/tsnnls/handoff/tsnnls-header-missing-stdio.
        run: |
          printf '#include <libtsnnls/tsnnls.h>\nint main(void){return 0;}\n' > cxx_smoke_ts.cc
          c++ -I"$(brew --prefix)/include" -fsyntax-only cxx_smoke_ts.cc

  libtsnnls-rpm:
    name: libtsnnls (${{ matrix.container }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["fedora:latest", "rockylinux:9"]
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install prerequisites (dnf)
        run: |
          dnf -y install \
            gcc gcc-c++ make git procps-ng file tar gzip \
            findutils sudo util-linux diffutils
          dnf -y install which || true
      - name: Create non-root Homebrew user
        run: |
          useradd -m -s /bin/bash linuxbrew
          echo 'linuxbrew ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/linuxbrew
      - name: Check out tap
        uses: actions/checkout@v4
      - name: Install + test libtsnnls as the linuxbrew user
        run: |
          cp -a "$GITHUB_WORKSPACE" /home/linuxbrew/cantarellalab
          chown -R linuxbrew:linuxbrew /home/linuxbrew/cantarellalab
          runuser -u linuxbrew -- bash -eux <<'EOSU'
          export NONINTERACTIVE=1
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          uname -m; brew --version | head -1
          TAPDIR="$(brew --repository)/Library/Taps/designbynumbers/homebrew-cantarellalab"
          mkdir -p "$(dirname "$TAPDIR")"
          ln -s /home/linuxbrew/cantarellalab "$TAPDIR"
          # A manually-bootstrapped brew enforces HOMEBREW_REQUIRE_TAP_TRUST, so trust our
          # symlinked tap -- otherwise loading cross-tap deps (ridgerunner -> libplcurve/
          # libtsnnls) is refused. (setup-homebrew does this automatically on native legs.)
          brew trust designbynumbers/cantarellalab
          brew audit --strict designbynumbers/cantarellalab/libtsnnls
          brew install --build-from-source --verbose designbynumbers/cantarellalab/libtsnnls
          brew test --verbose designbynumbers/cantarellalab/libtsnnls
          # C++ header smoke test: tsnnls.h must be self-contained (it uses FILE* without
          # including <stdio.h>). Fails until upstream adds the missing include.
          printf '#include <libtsnnls/tsnnls.h>\nint main(void){return 0;}\n' > /tmp/cxx_smoke_ts.cc
          c++ -I"$(brew --prefix)/include" -fsyntax-only /tmp/cxx_smoke_ts.cc
          EOSU
